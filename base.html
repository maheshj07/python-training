{% extends "base.html" %}

{% block content %}

<h1>Student Records</h1>

<table border="1">
    <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Attendance</th>
        <th>Marks</th>
    </tr>

    {% for student in students %}
    <tr>
        <td>{{ student.roll }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.attendance }}</td>
        <td>{{ student.marks }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
