{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-header bg-primary text-white text-center">

<h3>

<i class="fa fa-user-circle"></i>

Customer Login

</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Mobile Number</label>

<input
type="text"
name="mobile"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<button class="btn btn-primary w-100">

<i class="fa fa-sign-in-alt"></i>

Login

</button>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
