{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

```
<div class="card shadow">

    <div class="card-header bg-primary text-white">
        <h4>✏ Edit Product</h4>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label>Product Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ product.name }}"
                       required>
            </div>

            <div class="mb-3">
                <label>Category</label>
                <input type="text"
                       name="category"
                       class="form-control"
                       value="{{ product.category }}"
                       required>
            </div>

            <div class="mb-3">
                <label>Price</label>
                <input type="number"
                       step="0.01"
                       name="price"
                       class="form-control"
                       value="{{ product.price }}"
                       required>
            </div>

            <div class="mb-3">
                <label>Stock</label>
                <input type="number"
                       name="stock"
                       class="form-control"
                       value="{{ product.stock }}"
                       required>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea name="description"
                          class="form-control"
                          rows="4">{{ product.description }}</textarea>
            </div>

            <button type="submit"
                    class="btn btn-primary">
                Update Product
            </button>

            <a href="{{ url_for('admin_products') }}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>
```

</div>

{% endblock %}
