{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3>Register</h3>
        <form method="post" class="card card-body shadow-sm">
            <input class="form-control mb-2" type="text" name="name" placeholder="Full Name" required>
            <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
            <input class="form-control mb-2" type="text" name="mobile" placeholder="Mobile No." required>
            <textarea class="form-control mb-2" name="address" placeholder="Address" required></textarea>
            <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>
            <button class="btn btn-primary">Register</button>
        </form>
    </div>
</div>
{% endblock %}
